<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#ECE1D4" />
    </linearGradient>
    <filter id="p4Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3A2A20" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#p4Grad)" />

  <g transform="translate(45, 35)" filter="url(#p4Shadow)">
    <rect width="510" height="315" rx="12" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="1.5" />

    <!-- Top Bar -->
    <path d="M0 12 Q0 0 12 0 L498 0 Q510 0 510 12 L510 38 L0 38 Z" fill="#F7F3EE" />
    <circle cx="20" cy="19" r="5" fill="#E76F51" />
    <circle cx="36" cy="19" r="5" fill="#E9C46A" />
    <circle cx="52" cy="19" r="5" fill="#2A9D8F" />
    <text x="80" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#242325">Landing Pages de Conversion &amp; Production Digitale</text>
    
    <rect x="385" y="9" width="110" height="20" rx="6" fill="#F0E3DE" />
    <text x="440" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#B85D43" text-anchor="middle">WordPress &amp; Vidéo</text>

    <!-- Content layout -->
    <g transform="translate(30, 55)">
      <!-- Left: Landing Page structure -->
      <rect width="250" height="235" rx="8" fill="#FDFBF7" stroke="#E6DDD2" stroke-width="1" />
      
      <!-- Mini hero -->
      <rect x="15" y="15" width="220" height="70" rx="6" fill="#F5EFEB" />
      <rect x="25" y="27" width="100" height="10" rx="3" fill="#B85D43" />
      <rect x="25" y="42" width="130" height="6" rx="2" fill="#887F76" />
      <rect x="25" y="52" width="110" height="6" rx="2" fill="#887F76" />
      <rect x="25" y="64" width="60" height="12" rx="4" fill="#242325" />
      
      <!-- Video thumbnail in hero -->
      <rect x="165" y="22" width="60" height="55" rx="4" fill="#242325" />
      <polygon points="190,42 202,50 190,58" fill="#FFFFFF" />

      <!-- Features grid -->
      <rect x="15" y="98" width="68" height="50" rx="4" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="0.8" />
      <circle cx="28" cy="112" r="6" fill="#B85D43" opacity="0.2" />
      <rect x="22" y="124" width="54" height="5" rx="2" fill="#4B4844" />
      <rect x="22" y="133" width="40" height="4" rx="2" fill="#A89E94" />

      <rect x="91" y="98" width="68" height="50" rx="4" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="0.8" />
      <circle cx="104" cy="112" r="6" fill="#B85D43" opacity="0.2" />
      <rect x="98" y="124" width="54" height="5" rx="2" fill="#4B4844" />
      <rect x="98" y="133" width="40" height="4" rx="2" fill="#A89E94" />

      <rect x="167" y="98" width="68" height="50" rx="4" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="0.8" />
      <circle cx="180" cy="112" r="6" fill="#B85D43" opacity="0.2" />
      <rect x="174" y="124" width="54" height="5" rx="2" fill="#4B4844" />
      <rect x="174" y="133" width="40" height="4" rx="2" fill="#A89E94" />

      <!-- Form row -->
      <rect x="15" y="160" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1" />
      <text x="25" y="178" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#242325">Formulaire de conversion optimisé</text>
      <rect x="25" y="188" width="90" height="18" rx="3" fill="#F5EFEB" stroke="#D8C9BC" stroke-width="0.8" />
      <rect x="120" y="188" width="105" height="18" rx="3" fill="#B85D43" />
      <text x="172" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">S'inscrire</text>
    </g>

    <!-- Right: Stats & Multidisciplinary Delivery -->
    <g transform="translate(305, 55)">
      <text x="0" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#242325">Impact &amp; Production de Contenus</text>
      
      <!-- Card 1 -->
      <rect x="0" y="30" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1.2" />
      <text x="15" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#7D746B">Taux de conversion</text>
      <text x="15" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#B85D43">+20%</text>
      <text x="75" y="72" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E7D32">vs pages génériques</text>

      <!-- Card 2 -->
      <rect x="0" y="102" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#EAE2D8" stroke-width="1.2" />
      <text x="15" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#7D746B">Contenus digitaux</text>
      <text x="15" y="146" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#242325">Vidéos &amp; Scénario</text>

      <!-- Card 3 -->
      <rect x="0" y="174" width="180" height="60" rx="8" fill="#FBF9F5" stroke="#EAE2D8" stroke-width="1.2" />
      <text x="15" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#7D746B">Campagnes mensuelles</text>
      <text x="15" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#242325">100% On-time</text>
      <text x="120" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#B85D43">Axalone</text>
    </g>
  </g>
</svg>
