<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EE" />
      <stop offset="100%" stop-color="#EDE2D6" />
    </linearGradient>
    <filter id="p3Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3A2A20" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#p3Grad)" />

  <g transform="translate(45, 35)" filter="url(#p3Shadow)">
    <!-- Main Window Frame (Figma Style) -->
    <rect width="510" height="315" rx="12" fill="#242325" stroke="#1A191A" stroke-width="1.5" />

    <!-- Top Bar -->
    <path d="M0 12 Q0 0 12 0 L498 0 Q510 0 510 12 L510 36 L0 36 Z" fill="#1C1B1C" />
    <circle cx="20" cy="18" r="4.5" fill="#E76F51" />
    <circle cx="34" cy="18" r="4.5" fill="#E9C46A" />
    <circle cx="48" cy="18" r="4.5" fill="#2A9D8F" />
    <text x="75" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5E0DB">Figma ⸱ Platform_DesignSystem_v2.fig</text>
    
    <!-- Figma tools bar -->
    <g transform="translate(360, 10)">
      <rect width="60" height="18" rx="4" fill="#383638" />
      <text x="30" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#D3C9BD" text-anchor="middle">Share</text>
      <rect x="70" y="0" width="65" height="18" rx="4" fill="#B85D43" />
      <text x="102" y="13" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">▶ Present</text>
    </g>

    <!-- Canvas area -->
    <rect x="0" y="36" width="510" height="279" fill="#2E2C2E" />

    <!-- Left Layers Panel -->
    <rect x="0" y="36" width="105" height="279" fill="#242325" />
    <text x="12" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#A89E94">PAGES &amp; LAYERS</text>
    <rect x="8" y="65" width="90" height="18" rx="4" fill="#3D3A3D" />
    <text x="16" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">❖ Design System</text>
    <text x="16" y="98" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#9C9289"># Wireframes</text>
    <text x="16" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#9C9289"># User Flows</text>
    <text x="16" y="134" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#9C9289"># Desktop UI</text>
    <text x="16" y="152" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#9C9289"># Mobile UI</text>

    <!-- Artboard 1: Desktop Layout -->
    <g transform="translate(125, 55)">
      <text x="0" y="-6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#A89E94">Desktop 1440px</text>
      <rect width="210" height="140" rx="6" fill="#FDFBF7" stroke="#484448" stroke-width="1" />
      
      <!-- Nav in artboard -->
      <rect x="10" y="8" width="190" height="12" rx="3" fill="#EFE8DE" />
      <circle cx="20" cy="14" r="3" fill="#B85D43" />
      <rect x="150" y="11" width="40" height="6" rx="3" fill="#B85D43" />
      
      <!-- Hero inside artboard -->
      <rect x="15" y="30" width="90" height="10" rx="3" fill="#242325" />
      <rect x="15" y="44" width="80" height="6" rx="2" fill="#887F76" />
      <rect x="15" y="53" width="65" height="6" rx="2" fill="#887F76" />
      <rect x="15" y="65" width="45" height="12" rx="4" fill="#B85D43" />
      <rect x="120" y="30" width="75" height="48" rx="4" fill="#EFE8DE" />

      <!-- 3 Columns inside artboard -->
      <rect x="15" y="90" width="55" height="38" rx="4" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="0.8" />
      <rect x="78" y="90" width="55" height="38" rx="4" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="0.8" />
      <rect x="141" y="90" width="55" height="38" rx="4" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="0.8" />
    </g>

    <!-- Artboard 2: Mobile UI -->
    <g transform="translate(355, 55)">
      <text x="0" y="-6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#A89E94">Mobile 390px</text>
      <rect width="85" height="140" rx="6" fill="#FDFBF7" stroke="#484448" stroke-width="1" />
      
      <rect x="6" y="8" width="73" height="8" rx="2" fill="#EFE8DE" />
      <rect x="8" y="24" width="55" height="8" rx="2" fill="#242325" />
      <rect x="8" y="36" width="68" height="28" rx="3" fill="#EFE8DE" />
      <rect x="8" y="70" width="68" height="25" rx="3" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="0.8" />
      <rect x="8" y="100" width="68" height="25" rx="3" fill="#FFFFFF" stroke="#E2D8CD" stroke-width="0.8" />
    </g>

    <!-- Figma Multi-cursor simulation -->
    <g transform="translate(260, 110)">
      <polygon points="0,0 12,12 7,13 10,19 7,20 4,14 0,16" fill="#B85D43" />
      <rect x="12" y="14" width="75" height="16" rx="4" fill="#B85D43" />
      <text x="49" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aurélie (PO)</text>
    </g>

    <!-- Bottom Metrics Pill -->
    <g transform="translate(125, 215)">
      <rect width="365" height="85" rx="8" fill="#1C1B1C" stroke="#3D3A3D" stroke-width="1" />
      <text x="20" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Livrables UX/UI &amp; Cadrage Fonctionnel</text>
      <text x="20" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#A89E94">Wireframes • User Journeys • Design System cohérent sous Figma</text>
      
      <g transform="translate(20, 56)">
        <rect width="145" height="20" rx="10" fill="#302D28" stroke="#D4A373" stroke-width="1" />
        <text x="72" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#E8B888" text-anchor="middle">⚡ -30% temps de dev</text>

        <rect x="155" y="0" width="165" height="20" rx="10" fill="#203028" stroke="#52B788" stroke-width="1" />
        <text x="237" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#74C69D" text-anchor="middle">✓ Validation client 1er jalon</text>
      </g>
    </g>
  </g>
</svg>
